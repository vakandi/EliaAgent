services:
  subworker-srv:
    build: .
    container_name: elia-subworker-srv
    restart: unless-stopped
    # Cap container memory so a runaway opencode/uvicorn can't exhaust the
    # host (the entrypoint auto-restarts opencode after a cgroup OOM-kill).
    mem_limit: 4g
    env_file:
      - .env
    ports:
      - "5656:5656"
    environment:
      - TZ=Africa/Casablanca
      - OPENCODE_SERVER_URL=http://127.0.0.1:5655
      - OPENCODE_WORKSPACE=/data
      - COMPOSE_PROJECT_DIR=/data/subworkers/server
      - CONFIG_DIR=/data/config
      - SUBWORKERS_DIR=/data/subworkers
      - LOG_DIR=/data/logs
      - PROXY_ENABLED=true
      - OPENCODE_CONFIG=/root/.config/opencode/opencode.json
    volumes:
      # SECURITY: Docker socket intentionally NOT mounted. Mounting it here
      # gave any subworker agent (running as root in this container) full
      # host compromise via `docker run -v /:/host`. The tunnel manager's
      # cloudflared container runs independently with restart: unless-stopped,
      # so the tunnel stays up without the socket. Tunnel start/stop/remove
      # via the API now fail gracefully (TunnelError) instead of escalating.
      - ${HOME}/EliaAI/subworkers/server/app/config:/data/config:rw
      - ${HOME}/EliaAI/subworkers:/data/subworkers:rw
      - ${HOME}/EliaAI/subworkers/logs:/data/logs:rw
      - ${HOME}/EliaAI/setup/proxies.txt:/data/proxies.txt:ro
      # Persist container opencode sessions across docker rm / colima stop.
      # Host TUI uses ~/.local/share/opencode — container uses this bind-mount
      # (separate file, no concurrent corruption). Fixes kill_docker wipe.
      - ${HOME}/EliaAI/subworkers/server/opencode-data:/root/.local/share/opencode:rw
      # Share configuration only. Never share the *same* DB file with host TUI.
      - ${HOME}/.config/opencode:/root/.config/opencode:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5656/health && curl -sf http://localhost:5655/global/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    image: server-cloudflared:latest
    container_name: elia-cloudflared
    restart: unless-stopped
    depends_on:
      - subworker-srv
    volumes:
      - ${HOME}/EliaAI/subworkers/server/app/config:/data/config:ro
