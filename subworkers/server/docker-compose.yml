services:
  subworker-srv:
    build: .
    container_name: elia-subworker-srv
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5656:5656"
    environment:
      - OPENCODE_SERVER_URL=http://127.0.0.1:5655
      - OPENCODE_WORKSPACE=/data
      - COMPOSE_PROJECT_DIR=/data/subworkers/server
      - CONFIG_DIR=/data/config
      - SUBWORKERS_DIR=/data/subworkers
      - LOG_DIR=/data/logs
      - PROXY_ENABLED=false
      - OPENCODE_CONFIG=/root/.config/opencode/opencode.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/EliaAI/subworkers/server/app/config:/data/config:rw
      - ${HOME}/EliaAI/subworkers:/data/subworkers:rw
      - ${HOME}/EliaAI/subworkers/logs:/data/logs:rw
      # Share configuration only. Never share OpenCode's SQLite data/cache
      # with the host: the TUI and this server may run concurrently.
      - ${HOME}/.config/opencode:/root/.config/opencode:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5656/health && curl -sf http://localhost:5655/global/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
