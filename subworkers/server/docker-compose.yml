services:
  subworker-srv:
    build: .
    container_name: elia-subworker-srv
    restart: unless-stopped
    ports:
      - "5656:5656"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Ensure localhost inside container also resolves to host
      # This lets subworkers reach host MCP servers (WhatsApp, Discord, etc.)
      - "localhost:host-gateway"
    environment:
      - OPENCODE_SERVER_URL=http://host.docker.internal:4096
      - OPENCODE_WORKSPACE=/root/EliaAI
      - CONFIG_DIR=/data/config
      - SUBWORKERS_DIR=/data/subworkers
      - LOG_DIR=/data/logs
      - PROXY_ENABLED=false
      - OPENCODE_CONFIG=/root/.config/opencode/opencode.json
    volumes:
      # JSON configs (read-write — enable/disable persists to disk)
      - ${HOME}/EliaAI/subworkers/server/app/config:/data/config:rw
      # Subworker workspaces (read-write)
      - ${HOME}/EliaAI/subworkers:/data/subworkers:rw
      # Logs (read-write)
      - ${HOME}/EliaAI/subworkers/logs:/data/logs:rw
      # Host OpenCode MCP config — subworkers use the same MCP servers as the host
      - ${HOME}/.config/opencode:/root/.config/opencode:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5656/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
